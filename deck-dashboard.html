<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline JSON Decoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-sky-400">Pipeline JSON Decoder</h1>
            <p class="text-xs text-slate-400 font-mono mt-1">
                Decompress (zlib/gzip) &rarr; Base64 Decode &rarr; XOR 0xC8 &rarr; UTF-16LE &rarr; Formatted JSON
            </p>
        </header>

        <!-- Main Card -->
        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl space-y-4">
            
            <!-- File Upload Input -->
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">Upload Encrypted File</label>
                <input type="file" id="fileInput" class="block w-full text-sm text-slate-400
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-semibold
                    file:bg-sky-600 file:text-white
                    hover:file:bg-sky-500 cursor-pointer"/>
            </div>

            <!-- Error Banner -->
            <div id="errorBox" class="hidden p-4 rounded-lg bg-red-950/80 border border-red-500/50 text-red-200 text-sm font-mono whitespace-pre-wrap"></div>

            <!-- Pipeline Status -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-xs font-mono">
                <div id="step1" class="p-2 rounded bg-slate-900 border border-slate-700 text-center">1. Read Raw</div>
                <div id="step2" class="p-2 rounded bg-slate-900 border border-slate-700 text-center">2. Decompress</div>
                <div id="step3" class="p-2 rounded bg-slate-900 border border-slate-700 text-center">3. Base64</div>
                <div id="step4" class="p-2 rounded bg-slate-900 border border-slate-700 text-center">4. XOR 0xC8</div>
                <div id="step5" class="p-2 rounded bg-slate-900 border border-slate-700 text-center">5. UTF-16LE</div>
            </div>

            <!-- Output Preview -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-slate-300">Decoded JSON Preview</span>
                    <button id="downloadBtn" disabled class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded text-sm transition font-medium">
                        Download JSON
                    </button>
                </div>
                <textarea id="output" readonly rows="16" placeholder="Upload a file above to view output..." class="w-full bg-slate-950 text-emerald-400 font-mono text-xs p-4 rounded-lg border border-slate-800 focus:outline-none"></textarea>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorBox = document.getElementById('errorBox');

        let decodedData = null;
        let originalFileName = "decoded_output.json";

        function updateStepStatus(stepId, status) {
            const el = document.getElementById(stepId);
            if (status === 'active') {
                el.className = "p-2 rounded bg-amber-950 border border-amber-500 text-amber-300 text-center";
            } else if (status === 'success') {
                el.className = "p-2 rounded bg-emerald-950 border border-emerald-500 text-emerald-300 text-center";
            } else if (status === 'error') {
                el.className = "p-2 rounded bg-red-950 border border-red-500 text-red-300 text-center";
            } else {
                el.className = "p-2 rounded bg-slate-900 border border-slate-700 text-center text-slate-500";
            }
        }

        function resetSteps() {
            ['step1', 'step2', 'step3', 'step4', 'step5'].forEach(id => updateStepStatus(id, 'reset'));
            errorBox.classList.add('hidden');
            errorBox.innerText = '';
        }

        // Handle File Selection
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalFileName = file.name.replace(/\.[^/.]+$/, "") + "_decoded.json";
            resetSteps();
            output.value = "Processing pipeline...";

            try {
                // Step 1: Read Raw
                updateStepStatus('step1', 'active');
                const rawBuffer = await file.arrayBuffer();
                updateStepStatus('step1', 'success');

                // Step 2: Decompress (supports zlib/gzip)
                updateStepStatus('step2', 'active');
                let decompressedBuffer;
                try {
                    // Try native browser decompressor (deflate/gzip)
                    const ds = new DecompressionStream('deflate-raw');
                    const writer = ds.writable.getWriter();
                    writer.write(new Uint8Array(rawBuffer));
                    writer.close();
                    decompressedBuffer = await new Response(ds.readable).arrayBuffer();
                } catch {
                    // Fallback to standard deflate/gzip format headers
                    const ds = new DecompressionStream('gzip');
                    const writer = ds.writable.getWriter();
                    writer.write(new Uint8Array(rawBuffer));
                    writer.close();
                    decompressedBuffer = await new Response(ds.readable).arrayBuffer();
                }
                updateStepStatus('step2', 'success');

                // Step 3: Base64 Decode
                updateStepStatus('step3', 'active');
                const decompressedText = new TextDecoder('ascii').decode(decompressedBuffer);
                const b64Cleaned = decompressedText.replace(/\s+/g, '');
                const binaryStr = atob(b64Cleaned);
                const stepBytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    stepBytes[i] = binaryStr.charCodeAt(i);
                }
                updateStepStatus('step3', 'success');

                // Step 4: XOR 0xC8
                updateStepStatus('step4', 'active');
                const xorBytes = new Uint8Array(stepBytes.length);
                for (let i = 0; i < stepBytes.length; i++) {
                    xorBytes[i] = stepBytes[i] ^ 0xC8;
                }
                updateStepStatus('step4', 'success');

                // Step 5: UTF-16LE Decoding & JSON Parsing
                updateStepStatus('step5', 'active');
                const utf16Decoder = new TextDecoder('utf-16le');
                const decodedText = utf16Decoder.decode(xorBytes);

                // Format JSON output
                const parsedJsonObject = JSON.parse(decodedText);
                decodedData = JSON.stringify(parsedJsonObject, null, 2);
                
                output.value = decodedData;
                updateStepStatus('step5', 'success');
                downloadBtn.disabled = false;

            } catch (err) {
                errorBox.innerText = `Pipeline Error: ${err.message}`;
                errorBox.classList.remove('hidden');
                output.value = "Failed to process file.";
            }
        });

        // Download Decoded JSON
        downloadBtn.addEventListener('click', () => {
            if (!decodedData) return;
            const blob = new Blob([decodedData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = originalFileName;
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
